services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: aegis-backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend/aegis:/app/aegis
      - backend_data:/app/data
      - model_cache:/root/.cache
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      AEGIS_QDRANT_URL: http://qdrant:6333
      AEGIS_QDRANT_API_KEY: ""
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        AEGIS_BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_API_URL: /api
    container_name: aegis-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: /api
      AEGIS_BACKEND_URL: http://backend:8000
      API_HOST: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aegis-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && IFS= read -r status <&3 && [[ \"$$status\" == *\"200\"* ]]",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_data:
    driver: local
  backend_data:
    driver: local
  model_cache:
    driver: local
