[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aegisai-backend"
version = "0.1.0"
description = "AegisAI Milestone 3 — Full Stack with Docker"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pydantic-ai>=0.0.30,<2",
  "google-genai>=1,<2",
  "groq>=0.9,<1",
  "langsmith>=0.2,<1",
  "langgraph>=0.2,<1",
  "tavily-python>=0.5,<1",
  "docling>=2,<3",
  "qdrant-client>=1.12,<2",
  "httpx>=0.27,<1",
  "tenacity>=9,<10",
  "structlog>=24.4,<26",
  "matplotlib>=3.8,<4",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "pandas>=2.2,<4",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "fpdf>=1.7.2",
  "fastembed>=0.8,<1",
  "pymupdf>=1.24,<3",
  "pypdf>=5,<6",
  "paddleocr>=2.7,<4",
  "rapidocr>=3.0,<4",
  "sentence-transformers>=3,<4",
  "torch>=2,<3",
  "transformers>=4.40,<5",
  "huggingface-hub>=0.23,<1",
  "langchain>=0.3,<1",
  "langchain-community>=0.3,<1",
  "langchain-huggingface>=0.1,<1",
  "langchain-core>=0.3,<1",
  "langchain-text-splitters>=0.3,<1",
  "streamlit>=1.35,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "fpdf>=1.7.2",
]

[project.scripts]
aegis-smoke-gemini = "aegis.cli:smoke_gemini"

[tool.hatch.build.targets.wheel]
packages = ["aegis"]

[tool.hatch.build.targets.wheel.shared-data]
"aegis/prompts/*.md" = "aegis/prompts"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["aegis", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["aegis"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aegis"]
warn_unused_ignores = true
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["pydantic_ai.*", "langsmith.*", "google.*", "qdrant_client.*", "tavily.*", "docling.*", "langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
pythonpath = ["aegis"]
testpaths = ["tests"]
markers = [
  "unit: fast tests without external services",
  "integration: tests requiring configured external services",
  "live: tests that make live provider calls",
]
